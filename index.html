<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="프로필 사이트" />
    <title>프로필</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #10131a;
        color: #f6f7fb;
      }

      main {
        width: min(38rem, calc(100% - 3rem));
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.5rem, 8vw, 5rem);
      }

      p {
        margin: 0;
        color: #b9c0d0;
        font-size: 1.125rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>안녕하세요.</h1>
      <p>프로필 사이트를 준비하고 있습니다.</p>
    </main>
  </body>
</html>
